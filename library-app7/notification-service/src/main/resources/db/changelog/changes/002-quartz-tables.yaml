# ЛР6 — схема Quartz 2.3.2 для PostgreSQL під керуванням Liquibase.
# Джерело: org/quartz/impl/jdbcjobstore/tables_postgres.sql з quartz-2.3.2.jar, переписано в YAML 1:1.
# Бінарні колонки: на PostgreSQL ОБОВ'ЯЗКОВО BYTEA (як у tables_postgres.sql). Узагальнений тип Liquibase BLOB
# на PostgreSQL перетворюється на OID, і Quartz падає: "column job_data is of type oid but expression is of type bytea".
# Тому тип задано явно для кожної СУБД через властивість ${quartz.binary.type} (H2 — для integration-тестів).
# Spring Boot сам таблиці НЕ створює: spring.quartz.jdbc.initialize-schema=never.
databaseChangeLog:
  - property:
      name: quartz.binary.type
      value: BYTEA
      dbms: postgresql
  - property:
      name: quartz.binary.type
      value: BLOB
      dbms: h2
  - changeSet:
      id: 002-quartz-tables
      author: student
      comment: Quartz JDBC job store tables (QRTZ_*)
      changes:
        - createTable:
            tableName: qrtz_job_details
            columns:
              - column:
                  name: sched_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: job_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: job_group
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(250)
              - column:
                  name: job_class_name
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: is_durable
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: is_nonconcurrent
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: is_update_data
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: requests_recovery
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: job_data
                  type: ${quartz.binary.type}
        - addPrimaryKey:
            tableName: qrtz_job_details
            columnNames: sched_name, job_name, job_group
            constraintName: pk_qrtz_job_details
        - createTable:
            tableName: qrtz_triggers
