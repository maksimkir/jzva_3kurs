<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book form</title>
  <style>
    body{font-family:sans-serif;max-width:600px;margin:40px auto}
    label{display:block;margin-top:12px} input,textarea{width:100%;padding:6px;box-sizing:border-box}
    .err{color:#c00;font-size:.9em}
  </style>
</head>
<body>
<h1 th:text="${book.id == null} ? 'Нова книга' : 'Редагування книги'"></h1>
<form th:action="@{/books}" th:object="${book}" method="post">
  <input type="hidden" th:field="*{id}">
  <label>Назва
    <input type="text" th:field="*{title}">
    <span class="err" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
  </label>
  <label>Автор
    <input type="text" th:field="*{author}">
    <span class="err" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
  </label>
  <label>ISBN
    <input type="text" th:field="*{isbn}">
    <span class="err" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span>
  </label>
  <label>Рік видання
    <input type="number" th:field="*{publishedYear}">
    <span class="err" th:if="${#fields.hasErrors('publishedYear')}" th:errors="*{publishedYear}"></span>
  </label>
  <label>Опис
    <textarea rows="4" th:field="*{description}"></textarea>
  </label>
  <p><button type="submit">Зберегти</button> <a th:href="@{/books}">Скасувати</a></p>
</form>
</body>
</html>
