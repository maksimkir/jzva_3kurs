databaseChangeLog:
  - changeSet:
      id: 001-create-books-table
      author: student
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: isbn
                  type: VARCHAR(20)
              - column:
                  name: published_year
                  type: INT
              - column:
                  name: description
                  type: VARCHAR(2000)
