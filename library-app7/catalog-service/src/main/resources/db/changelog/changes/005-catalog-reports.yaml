# ЛР6 — результати планового звіту по каталогу.
# Унікальність (period, period_start) гарантує, що повторний запуск звіту за той самий період
# не створить дубль: сервіс оновлює існуючий рядок (і лише якщо дані змінилися).
databaseChangeLog:
  - changeSet:
      id: 005-catalog-reports
      author: student
      changes:
        - createTable:
            tableName: catalog_reports
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: period
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: total_books
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: books_with_isbn
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: top_authors
                  type: VARCHAR(2000)
              - column:
                  name: generated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: catalog_reports
            columnNames: period, period_start
            constraintName: uq_catalog_reports_period
