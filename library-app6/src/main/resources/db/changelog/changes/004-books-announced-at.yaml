# ЛР6 — позначка «книгу вже включено в дайджест новинок».
# Саме по ній дайджест ідемпотентний: повторний запуск бере лише книги з announced_at IS NULL.
databaseChangeLog:
  - changeSet:
      id: 004-books-announced-at
      author: student
      changes:
        - addColumn:
            tableName: books
            columns:
              - column:
                  name: announced_at
                  type: TIMESTAMP WITH TIME ZONE
        # Книги, що вже були в каталозі до появи дайджесту, не розсилаємо як «новинки»
        - update:
            tableName: books
            columns:
              - column:
                  name: announced_at
                  valueComputed: CURRENT_TIMESTAMP
