                    nullable: false
              - column:
                  name: trigger_group
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: job_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: job_group
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(250)
              - column:
                  name: next_fire_time
                  type: BIGINT
              - column:
                  name: prev_fire_time
                  type: BIGINT
              - column:
                  name: priority
                  type: INTEGER
              - column:
                  name: trigger_state
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: trigger_type
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
